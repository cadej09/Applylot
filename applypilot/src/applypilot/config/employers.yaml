# Workday employer registry for ApplyPilot
# US-focused list (Seattle/WA + nationwide employers with heavy analyst/data
# hiring). Every endpoint below was verified live against the Workday CXS API.
#
# Add your own: find the URL at https://[company].wd[N].myworkdayjobs.com,
# then read tenant + site_id from the path /wday/cxs/<tenant>/<site_id>/jobs.
# (The Canadian default list is preserved in employers.yaml.canadian.bak.)

employers:

  # ── Seattle / Pacific Northwest ─────────────────────────────────────────

  tmobile:
    name: "T-Mobile"
    tenant: "tmobile"
    site_id: "External"
